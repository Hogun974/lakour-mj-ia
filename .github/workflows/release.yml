# Release GitHub à chaque tag « v<version> » (ex. v0.39.0) : essais, archive du module, puis publication du manifeste
# et de l'archive en pièces jointes. Adresse stable donnée aux joueurs (Foundry › Modules › Installer un module) :
#   https://github.com/Hogun974/lakour-mj-ia/releases/latest/download/module.json
# Le tag doit porter la version déjà écrite dans module.json (outils/empaqueter-module.mjs refuse sinon), et la
# section correspondante de CHANGELOG.md sert de notes de version.
name: Release

on:
  push:
    tags: ["v*"]
  # Release à blanc, à la main (Actions › Release › Run workflow, sur principale ou une autre branche) :
  # tout est fabriqué et vérifié comme pour une vraie release, avec la version du manifeste (comme si l'étiquette
  # v<version> était posée) ; le contenu de dist/ est déposé en artefact du workflow, rien n'est publié.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Dépôt
        uses: actions/checkout@v5

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Dépendances (versions épinglées de package-lock.json)
        run: npm ci

      # Sur une étiquette, sa version (l'empaqueteur refuse si module.json ne la porte pas). Release à blanc hors étiquette :
      # la version de module.json, comme si l'étiquette v<version> était posée (rien à comparer, aucun échec).
      - name: Version du tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            VERSION=$(node -p "require('./module.json').version")
            echo "Release à blanc sur « $GITHUB_REF_NAME » (pas d'étiquette) : empaquetage comme v$VERSION"
            echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          fi

      - name: Essais (aucun réseau, aucune clé)
        run: npm run essais

      - name: SDK embarqués à jour (vendor/ doit correspondre aux versions de package.json)
        run: |
          for p in "@anthropic-ai/sdk vendor/anthropic.mjs" "openai vendor/openai.mjs"; do
            set -- $p
            attendu=$(node -p "require('./node_modules/$1/package.json').version")
            head -c 200 "$2" | grep -q "$1 $attendu " || { echo "$2 n'est pas embarqué depuis $1 $attendu : lancer npm run embarquer et commiter vendor/"; exit 1; }
          done

      - name: Archive du module et manifeste publié
        run: node outils/empaqueter-module.mjs --version "$VERSION" --sortie dist

      # L'empaqueteur ne fait qu'avertir si un fichier manque : ici, une archive sans sa licence (MIT) ou sans les licences
      # des SDK embarqués (Apache-2.0, article 4) n'est pas publiée.
      - name: Licences dans l'archive (LICENSE, THIRD-PARTY-NOTICES.md)
        run: |
          for f in LICENSE THIRD-PARTY-NOTICES.md; do
            unzip -Z1 dist/lakour-mj-ia.zip | grep -qx "$f" || { echo "$f absent de dist/lakour-mj-ia.zip"; exit 1; }
          done

      - name: Notes de version (section du CHANGELOG)
        run: |
          awk -v v="$VERSION" '/^## /{p = ($2 == v)} p' CHANGELOG.md > dist/notes.md
          if [ ! -s dist/notes.md ]; then echo "Version $VERSION du module La Kour – MJ IA." > dist/notes.md; fi

      - name: Publication
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          name: La Kour – MJ IA ${{ env.VERSION }}
          body_path: dist/notes.md
          files: |
            dist/module.json
            dist/lakour-mj-ia.zip
          fail_on_unmatched_files: true

      # Release à blanc (lancement à la main) : pas de release GitHub, dist/ est déposé en artefact à télécharger.
      - name: Release à blanc (dist/ déposé en artefact, rien n'est publié)
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-a-blanc-${{ env.VERSION }}
          path: dist/
          if-no-files-found: error
